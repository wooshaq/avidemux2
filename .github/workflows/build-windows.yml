name: Build Windows (MXE, Qt6)

on:
  push:
    branches: [master]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: build-windows
  cancel-in-progress: false

env:
  MXE_REV: 215428bf6f9c4e634f2fb827849a9c027dfe950a
  CACHE_VER: v1
  MXE_STAGE1_PKGS: >-
    nasm faad2 fdk-aac fribidi lame libass libvpx ogg opencore-amr opus sdl3
    vorbis x264 x265 xvidcore

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      toolchain-ready: ${{ steps.lookup.outputs.cache-hit }}
    steps:
      - id: lookup
        uses: actions/cache/restore@v4
        with:
          path: /opt/mxe
          key: mxe-${{ env.MXE_REV }}-${{ env.CACHE_VER }}-stage2
          lookup-only: true

  mxe-stage1:
    needs: check
    if: needs.check.outputs.toolchain-ready != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Host packages
        run: .github/scripts/mxe-host-deps.sh
      - id: cache1
        uses: actions/cache/restore@v4
        with:
          path: /opt/mxe
          key: mxe-${{ env.MXE_REV }}-${{ env.CACHE_VER }}-stage1
      - name: Prepare MXE
        if: steps.cache1.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/mxe && sudo chown $USER /opt/mxe
          git clone https://github.com/mxe/mxe.git /opt/mxe
          cd /opt/mxe
          git checkout "$MXE_REV"
          printf 'MXE_TARGETS := x86_64-w64-mingw32.shared\nJOBS := 4\nMXE_SILENT_NO_NETWORK :=\n' > settings.mk
          patch -p1 < "$GITHUB_WORKSPACE/mxe/fdk-aac.patch"
          patch -p1 < "$GITHUB_WORKSPACE/mxe/qt6-qtimageformats-deps.patch"
      - name: Build codecs
        if: steps.cache1.outputs.cache-hit != 'true'
        run: |
          cd /opt/mxe
          make $MXE_STAGE1_PKGS || { tail -n 80 log/*-x86_64-w64-mingw32.shared 2>/dev/null | tail -n 200; exit 1; }
          rm -rf pkg/* log tmp-*
          du -sh /opt/mxe
      - uses: actions/cache/save@v4
        if: steps.cache1.outputs.cache-hit != 'true'
        with:
          path: /opt/mxe
          key: mxe-${{ env.MXE_REV }}-${{ env.CACHE_VER }}-stage1

  mxe-stage2:
    needs: mxe-stage1
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Host packages
        run: .github/scripts/mxe-host-deps.sh
      - uses: actions/cache/restore@v4
        with:
          path: /opt/mxe
          key: mxe-${{ env.MXE_REV }}-${{ env.CACHE_VER }}-stage1
          fail-on-cache-miss: true
      - name: Build Qt6
        run: |
          cd /opt/mxe
          make qt6-qtbase qt6-qttools qt6-qtimageformats || { for f in log/*; do echo "== $f"; tail -n 60 "$f"; done | tail -n 300; exit 1; }
      - name: libaom + nv-codec-headers
        run: |
          export PATH=/opt/mxe/usr/bin:$PATH
          mkdir -p /tmp/aom && cd /tmp/aom
          AOM_TAG="v3.14.1" bash "$GITHUB_WORKSPACE/.devcontainer_mxe64/install-libaom.bash" /opt/mxe
          cd /tmp && git clone https://github.com/FFmpeg/nv-codec-headers.git && cd nv-codec-headers
          git checkout sdk/11.1
          make install DESTDIR=/opt/mxe/usr/x86_64-w64-mingw32.shared/ PREFIX=/
      - name: Trim
        run: |
          cd /opt/mxe && rm -rf pkg/* log tmp-*
          du -sh /opt/mxe
      - uses: actions/cache/save@v4
        with:
          path: /opt/mxe
          key: mxe-${{ env.MXE_REV }}-${{ env.CACHE_VER }}-stage2

  avidemux:
    needs: [check, mxe-stage1, mxe-stage2]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Host packages
        run: |
          .github/scripts/mxe-host-deps.sh
          sudo apt-get install -y python3-pefile nsis
      - uses: actions/cache/restore@v4
        with:
          path: /opt/mxe
          key: mxe-${{ env.MXE_REV }}-${{ env.CACHE_VER }}-stage2
          fail-on-cache-miss: true
      - name: Build Avidemux
        run: |
          mkdir -p "$RUNNER_TEMP/build" && cd "$RUNNER_TEMP/build"
          bash "$GITHUB_WORKSPACE/bootStrapCrossMingwQt6_2026.sh"
      - name: Build logs on failure
        if: failure()
        run: for f in /tmp/log*; do echo "== $f"; grep -n -B5 -A25 -E "error|Error" "$f" | head -n 150; done
      - name: Package
        run: |
          cd "$RUNNER_TEMP/build"
          VER=$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)
          echo "PKG=Avidemux_WsQ_win64_$(date +%Y%m%d)_$VER" >> "$GITHUB_ENV"
          mv avidemux64 "Avidemux_WsQ_win64_$(date +%Y%m%d)_$VER"
      - name: Installer (NSIS)
        run: |
          cd "$GITHUB_WORKSPACE/avidemux/winInstaller"
          VER="$(date +%Y.%m.%d)-$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)"
          makensis -V2 -DSRCDIR="$RUNNER_TEMP/build/$PKG" -DOUTFILE="$RUNNER_TEMP/build/Avidemux_WsQ_setup_$VER.exe" -DVERSION="$VER" avidemux_wsq.nsi
          echo "SETUP=Avidemux_WsQ_setup_$VER" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: ${{ runner.temp }}/build/${{ env.PKG }}
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SETUP }}
          path: ${{ runner.temp }}/build/${{ env.SETUP }}.exe
          retention-days: 30
